name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: EasyTier
  BUILD_CONFIGURATION: Release
  IPA_NAME: EasyTier-ios15-trollstore.ipa
  TEAM_ID: M2G6355ZK7
  BUILD_ROOT: ${{ github.workspace }}/.build
  CARGO_HOME: ${{ github.workspace }}/.build/cargo

jobs:
  build-and-release:
    name: Build and publish TrollStore IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode and install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${BUILD_ROOT}" "${CARGO_HOME}"
          echo "ARCHIVE_PATH=${BUILD_ROOT}/EasyTier.xcarchive" >> "${GITHUB_ENV}"
          echo "PACKAGE_PATH=${BUILD_ROOT}/package" >> "${GITHUB_ENV}"
          echo "EXPORT_PATH=${BUILD_ROOT}/export" >> "${GITHUB_ENV}"

          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi

          rustc --version
          protoc --version

      - name: Run lifecycle and profile tests
        shell: bash
        run: |
          bash -n ci_scripts/build-core.sh tests/run-swift-tests.sh
          bash tests/run-swift-tests.sh

      - name: Test IPA compatibility validator
        run: node --test tests/verify-ios15.test.cjs

      - name: Archive unsigned Release build
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project EasyTier.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            -derivedDataPath "${BUILD_ROOT}/DerivedData" \
            -clonedSourcePackagesDirPath "${BUILD_ROOT}/SourcePackages" \
            -resultBundlePath "${BUILD_ROOT}/ArchiveResult.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile \
            IPHONEOS_DEPLOYMENT_TARGET="${IPHONEOS_DEPLOYMENT_TARGET}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            2>&1 | tee "${BUILD_ROOT}/archive.log"

          # The final Mach-O target alone cannot detect a newer Rust/C object
          # linked with a warning. Refuse to package such a build.
          if grep -Ei 'built for .*newer|built for newer' "${BUILD_ROOT}/archive.log"; then
            echo 'A linked dependency requires a newer OS than the app target.' >&2
            exit 1
          fi

      - name: Verify iOS 15 bundle and Mach-O requirements
        run: node ci_scripts/verify-ios15.cjs "${ARCHIVE_PATH}/Products/Applications/EasyTier.app"

      - name: Ad-hoc sign app for TrollStore
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${ARCHIVE_PATH}/Products/Applications/EasyTier.app"
          TUNNEL_PATH="${APP_PATH}/PlugIns/EasyTierNetworkExtension.appex"
          WIDGET_PATH="${APP_PATH}/PlugIns/EasyTierWidgetExtension.appex"
          APP_ENTITLEMENTS="${BUILD_ROOT}/EasyTier.signing.entitlements"
          TUNNEL_ENTITLEMENTS="${BUILD_ROOT}/EasyTierNetworkExtension.signing.entitlements"
          WIDGET_ENTITLEMENTS="${BUILD_ROOT}/EasyTierWidgetExtension.signing.entitlements"

          create_signing_entitlements() {
            local source_path="$1"
            local bundle_path="$2"
            local output_path="$3"
            local bundle_identifier
            local application_identifier

            bundle_identifier="$(
              /usr/libexec/PlistBuddy \
                -c "Print :CFBundleIdentifier" \
                "${bundle_path}/Info.plist"
            )"
            application_identifier="${TEAM_ID}.${bundle_identifier}"

            cp "${source_path}" "${output_path}"
            /usr/libexec/PlistBuddy \
              -c "Add :application-identifier string ${application_identifier}" \
              -c "Add :com.apple.developer.team-identifier string ${TEAM_ID}" \
              -c "Add :keychain-access-groups array" \
              -c "Add :keychain-access-groups:0 string ${application_identifier}" \
              "${output_path}"
          }

          create_signing_entitlements \
            EasyTier/EasyTier.entitlements \
            "${APP_PATH}" \
            "${APP_ENTITLEMENTS}"
          create_signing_entitlements \
            EasyTierNetworkExtension/EasyTierNetworkExtension.entitlements \
            "${TUNNEL_PATH}" \
            "${TUNNEL_ENTITLEMENTS}"
          create_signing_entitlements \
            EasyTierWidgetExtension/EasyTierWidgetExtension.entitlements \
            "${WIDGET_PATH}" \
            "${WIDGET_ENTITLEMENTS}"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements "${WIDGET_ENTITLEMENTS}" \
            "${WIDGET_PATH}"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements "${TUNNEL_ENTITLEMENTS}" \
            "${TUNNEL_PATH}"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements "${APP_ENTITLEMENTS}" \
            "${APP_PATH}"

          # Verify each nested bundle independently before verifying the app.
          # This catches a provider whose signature or entitlements were lost
          # while the containing application was signed.
          codesign --verify --strict "${WIDGET_PATH}"
          codesign --verify --strict "${TUNNEL_PATH}"
          codesign --verify --deep --strict "${APP_PATH}"
          codesign --display --entitlements :- "${TUNNEL_PATH}"
          codesign --display --entitlements :- "${APP_PATH}"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${TUNNEL_PATH}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "${TUNNEL_PATH}/Info.plist"

      - name: Package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${ARCHIVE_PATH}/Products/Applications/EasyTier.app"
          mkdir -p "${PACKAGE_PATH}/Payload" "${EXPORT_PATH}"
          cp -R "${APP_PATH}" "${PACKAGE_PATH}/Payload/EasyTier.app"

          (
            cd "${PACKAGE_PATH}"
            /usr/bin/zip -qry "${EXPORT_PATH}/${IPA_NAME}" Payload
          )
          /usr/bin/unzip -tq "${EXPORT_PATH}/${IPA_NAME}"
          (cd "${EXPORT_PATH}" && shasum -a 256 "${IPA_NAME}" > "${IPA_NAME}.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EasyTier-ios15-trollstore-${{ github.run_number }}
          path: ${{ env.BUILD_ROOT }}/export/*
          if-no-files-found: error
          retention-days: 14

      - name: Update rolling nightly release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_NOTES="${BUILD_ROOT}/nightly-release-notes.md"

          {
            echo "Automated Release build from [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "- Build configuration: \`${BUILD_CONFIGURATION}\`"
            echo "- Minimum iOS: 15.0 (bundle and Mach-O checked)"
            echo "- Code signing: ad-hoc with Xcode Team ID \`${TEAM_ID}\` and complete app/extension entitlements"
            echo "- Built: ${BUILD_TIME}"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "> This credentials-free IPA is prepared for TrollStore. Normal iOS installation still requires signing with an Apple provisioning profile."
          } > "${RELEASE_NOTES}"

          git tag --force nightly "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --target "${GITHUB_SHA}" \
              --title "EasyTier Nightly (${SHORT_SHA})" \
              --notes-file "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
            gh release upload nightly \
              "${EXPORT_PATH}/${IPA_NAME}" \
              "${EXPORT_PATH}/${IPA_NAME}.sha256" \
              --clobber
            gh release delete-asset nightly \
              EasyTier-nightly-unsigned.ipa \
              --yes 2>/dev/null || true
            gh release delete-asset nightly \
              EasyTier-nightly-unsigned.ipa.sha256 \
              --yes 2>/dev/null || true
          else
            gh release create nightly \
              "${EXPORT_PATH}/${IPA_NAME}" \
              "${EXPORT_PATH}/${IPA_NAME}.sha256" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "EasyTier Nightly (${SHORT_SHA})" \
              --notes-file "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
          fi

      - name: Upload archive diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios15-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ env.BUILD_ROOT }}/ArchiveResult.xcresult
            ${{ env.BUILD_ROOT }}/archive.log
          if-no-files-found: ignore
          retention-days: 7
